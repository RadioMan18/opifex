name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev libxss-dev libxtst-dev libatk1.0-dev libatk-bridge2.0-dev libpango-1.0-dev libpangocairo-1.0-dev libwayland-dev libwayland-client-dev libwayland-server-dev libwayland-cursor-dev libegl-dev libgles-dev libdrm-dev

      - name: Install npm dependencies
        run: npm install

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check || echo "Formatting issues found - run cargo fmt locally"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run TypeScript type check
        run: npm run build

      - name: Run frontend tests
        run: npx vitest run
