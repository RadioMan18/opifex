[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/opifex-core",
    "crates/opifex-sandbox",
    "crates/opifex-engine",
    "crates/opifex-export",
    "crates/opifex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
