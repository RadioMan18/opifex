[package]
name = "opifex-sandbox"
version = "0.1.0"
description = "Opifex v2.0.0 QuickJS sandbox sidecar for Windows"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rquickjs = "0.14"
anyhow = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
