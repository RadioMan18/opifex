[package]
name = "opifex-engine"
version = "0.1.0"
description = "Opifex v2.0.0 execution engine — scheduler, node runtime, providers"
edition = "2021"

[dependencies]
opifex-core = { path = "../opifex-core" }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
