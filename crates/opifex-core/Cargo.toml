# Opifex v2.0.0 Core crate — graph schema, types, validator, expression language, migrations

[package]
name = "opifex-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]

